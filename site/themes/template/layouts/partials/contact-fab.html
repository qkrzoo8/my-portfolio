<!-- Floating Contact Button -->
<div id="contact-fab-popover" class="fab-popover">
  <p class="font-semibold text-sm mb-3 text-foreground">
    Contact
  </p>

  <p class="text-xs text-muted mb-3">
    프로젝트 코드와 개발 기록을 확인할 수 있습니다.
  </p>

  <a href="https://github.com/qkrzoo8" target="_blank" rel="noopener noreferrer"
    class="flex items-center gap-3 p-3 rounded-lg transition-colors"
    style="border: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.3);">

    <div>
      <p class="text-xs text-muted">GitHub</p>
      <p class="text-sm font-medium text-foreground">
        github.com/qkrzoo8
      </p>
    </div>
  </a>


  <!-- School Email -->
  <a href="mailto:{{ .Site.Params.email }}" class="flex items-center gap-3 p-3 rounded-lg transition-colors"
    style="border: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.3); margin-top: 0.5rem;">

    <div>
      <p class="text-xs text-muted">School Email</p>
      <p class="text-sm font-medium text-foreground">
        {{ .Site.Params.email }}
      </p>
    </div>
  </a>

</div>

<button id="contact-fab" class="fab" type="button" aria-label="연락처 열기" aria-expanded="false"
  aria-controls="contact-fab-popover">
  <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
  </svg>
</button>
