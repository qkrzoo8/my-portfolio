# 학습 및 개발 역량
- category: "Core Skills"
  items:
    - name: "Problem Solving"
      explanation: "Python을 활용한 알고리즘 문제 풀이와 인공지능 과제를 수행하며 문제 해결 능력을 키우고 있습니다."

    - name: "Web Development"
      explanation: "Spring Boot를 이용한 REST API 개발 실습을 통해 웹 서비스의 구조와 동작 원리를 학습했습니다."

    - name: "Database Design"
      explanation: "MySQL을 활용하여 데이터베이스를 설계하고, ERD 작성과 정규화 및 SQL 질의를 실습했습니다."

# 기술 및 개발 도구
- category: "Technical Skills"
  items:
    - name: "Python"
      explanation: "알고리즘 문제 해결과 인공지능 관련 프로젝트에 활용했습니다."

    - name: "Java"
      explanation: "Spring Boot 기반 웹 서비스 개발 실습에 활용했습니다."

